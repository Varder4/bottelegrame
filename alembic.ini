# NOTE: This file is read by configparser with the system locale encoding on Windows
# (cp1252), so it must stay ASCII-only. Vietnamese explanations live in env.py.

[alembic]
script_location = src/televip/db/migrations
prepend_sys_path = src
path_separator = os

# Sequential file names (0001_, 0002_) instead of random hashes: on-disk order
# matches apply order, which makes schema history readable.
file_template = %%(rev)s_%%(slug)s

# Left empty on purpose. The real URL comes from the app settings in env.py so that
# no database password is ever written into a committed file.
sqlalchemy.url =

[post_write_hooks]
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
