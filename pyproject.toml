[project]
name = "televip"
version = "0.1.0"
description = "Bot Telegram phát gift code — xây mới hoàn toàn"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]==21.*",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "fastapi>=0.115",
    # Panel quản trị web: Jinja2 dựng HTML phía máy chủ, python-multipart đọc form POST.
    # Thiếu gói thứ hai thì MỌI <form> gửi lên đều 400 mà không nói vì sao.
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0; sys_platform != 'win32'",
    "uvloop>=0.21; sys_platform != 'win32'",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Tài nguyên KHÔNG phải mã Python phải khai ở đây, nếu không `pip install .` bỏ lại
# chúng: giao diện panel (templates/static), ảnh màn XEM SHOW FULL, và migration.
# Triệu chứng khi thiếu là panel trả 500 lúc dựng trang, hoặc `alembic upgrade` không
# tìm thấy version nào — cả hai đều không nói gì về nguyên nhân.
#
# Thư mục `webapp/` (Mini App) nằm NGOÀI package nên không khai được ở đây; đó là lý do
# `deploy/TRIEN-KHAI.md` yêu cầu cài bằng `pip install -e .`.
[tool.setuptools.package-data]
televip = [
    "assets/*",
    "apps/adminweb/templates/*.html",
    "apps/adminweb/static/*",
    "db/migrations/*.py",
    "db/migrations/versions/*.py",
    "db/migrations/*.mako",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:televip.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]
ignore = [
    "S101", # assert — dùng trong test
    "E501", # độ dài dòng đã do formatter lo
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
# `scripts/*` là công cụ dòng lệnh chạy tay: `print` CHÍNH LÀ giao diện của chúng, và
# `subprocess` là cách chúng gọi alembic. Bắt hai luật này ở đây chỉ đẻ ra `# noqa` rải rác.
"scripts/*" = ["T20", "S603", "S607"]
# Chỉ tầng telegram/sender.py được phép gọi Bot API trực tiếp — kiểm bằng script riêng,
# ruff không diễn đạt được luật này nên xem scripts/check_architecture.py
