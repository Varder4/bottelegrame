# nginx cho HK79. Chep vao /etc/nginx/sites-available/televip roi:
#   ln -s /etc/nginx/sites-available/televip /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Thay MIENCUABAN.COM bang ten mien that (2 cho ben duoi).
#
# TLS: chay `certbot --nginx -d MIENCUABAN.COM -d panel.MIENCUABAN.COM` SAU KHI
# file nay da hoat dong o cong 80. Certbot tu them cac dong ssl_*.

# ══════════════════════════════════════════════════════════════════════
# Mini App xac minh — nguoi dung mo tu trong Telegram
# ══════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name MIENCUABAN.COM;

    # Telegram BAT BUOC Mini App phai chay tren HTTPS. Khong co TLS thi nut
    # "Xac minh ngay" mo ra mot trang trang, va khong ai xac minh duoc.

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ DONG NAY BAT BUOC. Thieu no thi ung dung tuong minh dang chay HTTP,
        # va moi thu phu thuoc "biet minh dang o HTTPS" deu hong.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════════
# Panel quan tri — chi chu bot dung
# ══════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name panel.MIENCUABAN.COM;

    # Panel nhan file anh cho tinh nang ban tin kem anh. Mac dinh nginx la 1 MB,
    # ma tran cua ung dung la 5 MB — de nguyen thi anh 2 MB bi nginx chan truoc
    # khi ung dung kip noi gi.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ THIEU DONG NAY THI PANEL COI NHU KHONG DUNG DUOC:
        # tang web kiem `Origin` cua moi request GHI phai khop `base_url`. Neu
        # ung dung tuong minh dang o `http://` con trinh duyet gui `https://`,
        # thi MOI nut ghi — sua cau chu, thu hoi ma, gui ban tin, doi cau hinh —
        # deu tra "trang khong ton tai", va khong co thong bao loi nao.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
